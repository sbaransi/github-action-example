name: Docker Login Lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  login-job:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub using Marketplace Action
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Verify Login
        run: echo "Successfully logged into Docker!"
